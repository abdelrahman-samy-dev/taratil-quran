<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>تراتيل — المصحف والتلاوة والأذكار</title>
    <meta
      name="description"
      content="تراتيل: تطبيق إسلامي مجاني ومفتوح المصدر. مصحف المدينة بخط واضح، تلاوات لأكثر من ٢٠٠ قارئ مع تظليل الآية، التفسير، الأذكار، مواقيت الصلاة والقبلة، ويعمل بدون إنترنت."
    />
    <meta name="theme-color" content="#059669" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="تراتيل" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="تراتيل — المصحف والتلاوة والأذكار" />
    <meta
      property="og:description"
      content="مصحف المدينة، تلاوات مع تظليل الآية، تفسير، أذكار، مواقيت الصلاة والقبلة — مجاناً وبدون إعلانات."
    />
    <meta property="og:image" content="/icons/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" href="/fonts/UthmanicHafs.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Apply saved theme before first paint (no flash).
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem('taratil:prefs') || '{}');
          var t = p.theme || 'system';
          if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          var d = document.documentElement;
          d.dataset.theme = t;
          d.dataset.shape = p.shape || 'rounded';
          if (p.fontScale) d.style.setProperty('--font-scale', p.fontScale);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>تراتيل يحتاج تفعيل JavaScript في المتصفح.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
